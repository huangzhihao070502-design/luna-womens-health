name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "build-tools;33.0.0" "platforms;android-33" 2>&1 | tail -5

      - name: Install deps and build uni-app
        run: |
          npm install
          npx uni build -p app

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore luna-release.keystore \
            -alias luna -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass lunapass123 -keypass lunapass123 \
            -dname "CN=Luna,OU=Dev,O=Luna,L=BJ,ST=BJ,C=CN"

      - name: Create Android project
        run: |
          mkdir -p android-project/app/src/main/java/com/luna/app
          mkdir -p android-project/app/src/main/res/values

          echo "rootProject.name='Luna'" > android-project/settings.gradle
          echo "include ':app'" >> android-project/settings.gradle

          cat > android-project/build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat > android-project/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.luna.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.luna.app"
                  minSdk 21; targetSdk 33
                  versionCode 100; versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("../luna-release.keystore")
                      storePassword "lunapass123"
                      keyAlias "luna"
                      keyPassword "lunapass123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application android:allowBackup="true" android:label="Luna"
                  android:hardwareAccelerated="true" android:usesCleartextTraffic="true">
                  <activity android:name="com.luna.app.MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > android-project/app/src/main/java/com/luna/app/MainActivity.java << 'JAVA'
          package com.luna.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("file:///android_asset/apps/__UNI__LUNA/www/__uniappview.html");
              }
          }
          JAVA

          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Luna</string></resources>' > android-project/app/src/main/res/values/strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="android:Theme.Light.NoTitleBar"><item name="android:windowBackground">@android:color/white</item></style></resources>' > android-project/app/src/main/res/values/styles.xml

          mkdir -p android-project/app/src/main/assets/apps/__UNI__LUNA/www
          cp -r dist/build/app/* android-project/app/src/main/assets/apps/__UNI__LUNA/www/

          echo "sdk.dir=/usr/local/lib/android/sdk" > android-project/local.properties

      - name: Build APK
        run: |
          cd android-project
          gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
