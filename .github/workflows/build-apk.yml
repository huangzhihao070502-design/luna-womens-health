name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          yes | ${SDK}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${SDK} "build-tools;33.0.0" "platforms;android-33"

      - name: Build uni-app resources
        run: |
          npm install
          npx uni build -p app

      - name: Generate keystore
        run: |
          $JAVA_HOME/bin/keytool -genkey -v \
            -keystore luna-release.keystore \
            -alias luna -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass lunapass123 -keypass lunapass123 \
            -dname "CN=Luna,OU=Dev,O=LunaTeam,L=Beijing,ST=Beijing,C=CN"

      - name: Build APK with Gradle
        run: |
          set -eux

          # Create clean Android project in subdirectory
          mkdir -p build-apk/app/src/main/java/com/luna/app
          mkdir -p build-apk/app/src/main/res/values
          mkdir -p build-apk/app/src/main/assets/apps/__UNI__LUNA/www

          # Copy uni-app resources
          cp -r dist/build/app/* build-apk/app/src/main/assets/apps/__UNI__LUNA/www/
          du -sh build-apk/app/src/main/assets/

          # settings.gradle with plugin repos
          cat > build-apk/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Luna'
          include ':app'
          EOF

          # Root build.gradle
          cat > build-apk/build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          # App build.gradle
          cat > build-apk/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.luna.app'
              compileSdk 33
              buildToolsVersion "33.0.0"
              defaultConfig {
                  applicationId "com.luna.app"
                  minSdk 21; targetSdk 33
                  versionCode 100; versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("../luna-release.keystore")
                      storePassword "lunapass123"
                      keyAlias "luna"
                      keyPassword "lunapass123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              sourceSets {
                  main {
                      assets.srcDirs = ['src/main/assets']
                  }
              }
          }
          EOF

          # AndroidManifest
          cat > build-apk/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:allowBackup="true" android:label="Luna"
                  android:hardwareAccelerated="true" android:usesCleartextTraffic="true">
                  <activity android:name="com.luna.app.MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # MainActivity
          cat > build-apk/app/src/main/java/com/luna/app/MainActivity.java << 'JAVA'
          package com.luna.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("file:///android_asset/apps/__UNI__LUNA/www/__uniappview.html");
              }
          }
          JAVA

          # Resources
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Luna</string></resources>' > build-apk/app/src/main/res/values/strings.xml

          # SDK location
          echo "sdk.dir=/usr/local/lib/android/sdk" > build-apk/local.properties

          # Copy keystore
          cp luna-release.keystore build-apk/

          # Verify assets before build
          echo "=== Assets exist? ==="
          ls -la build-apk/app/src/main/assets/apps/__UNI__LUNA/www/__uniappview.html
          du -sh build-apk/app/src/main/assets/
          echo "=== Project tree ==="
          find build-apk -maxdepth 5 -type f | grep -v '.gradle/' | sort

          # BUILD!
          cd build-apk
          gradle clean assembleRelease

      - name: Verify APK
        run: |
          ls -lh build-apk/app/build/outputs/apk/release/*.apk
          unzip -l build-apk/app/build/outputs/apk/release/*.apk | head -25

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-release-apk
          path: build-apk/app/build/outputs/apk/release/*.apk
