name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "build-tools;33.0.0" "platforms;android-33"

      - name: Install deps and build uni-app
        run: |
          npm install
          npx uni build -p app
          echo "=== Built resources ==="
          ls -la dist/build/app/
          echo "=== Resource size ==="
          du -sh dist/build/app/

      - name: Generate keystore
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          $JAVA_HOME/bin/keytool -genkey -v \
            -keystore luna-release.keystore \
            -alias luna -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass lunapass123 -keypass lunapass123 \
            -dname "CN=Luna,OU=Dev,O=LunaTeam,L=Beijing,ST=Beijing,C=CN" \
            2>&1 || (echo "keytool failed, trying alternative..." && \
            keytool -genkey -v \
            -keystore luna-release.keystore \
            -alias luna -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass lunapass123 -keypass lunapass123 \
            -dname "CN=Luna" 2>&1)
          ls -la luna-release.keystore

      - name: Setup Android project
        run: |
          set -eux
          # Verify build output exists
          ls -la dist/build/app/
          test -f dist/build/app/__uniappview.html || (echo "ERROR: uni-app build failed" && exit 1)

          # Create project structure
          mkdir -p app/src/main/java/com/luna/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets/apps/__UNI__LUNA/www

          # Copy uni-app resources into assets
          cp -r dist/build/app/* app/src/main/assets/apps/__UNI__LUNA/www/
          echo "=== Assets verification ==="
          ls app/src/main/assets/apps/__UNI__LUNA/www/__uniappview.html
          du -sh app/src/main/assets/

          # settings.gradle
          echo "rootProject.name='Luna'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # Root build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # App build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.luna.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.luna.app"
                  minSdk 21; targetSdk 33
                  versionCode 100; versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file("luna-release.keystore")
                      storePassword "lunapass123"
                      keyAlias "luna"
                      keyPassword "lunapass123"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              aaptOptions {
                  noCompress ''
              }
          }
          EOF

          # AndroidManifest
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="Luna"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity android:name="com.luna.app.MainActivity"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          # MainActivity
          cat > app/src/main/java/com/luna/app/MainActivity.java << 'JAVA'
          package com.luna.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  wv.setWebViewClient(new WebViewClient());
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("file:///android_asset/apps/__UNI__LUNA/www/__uniappview.html");
              }
          }
          JAVA

          # Resources
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Luna</string></resources>' > app/src/main/res/values/strings.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><style name="AppTheme" parent="android:Theme.Light.NoTitleBar"><item name="android:windowBackground">@android:color/white</item></style></resources>' > app/src/main/res/values/styles.xml

          # local.properties
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

          # Keystore is already at project root, verify
          test -f luna-release.keystore || (echo "ERROR: keystore missing" && exit 1)

          echo "=== Project structure ==="
          find . -type f | head -30

      - name: Build APK
        run: |
          gradle assembleRelease --info 2>&1 | tail -50

      - name: Verify APK
        run: |
          echo "=== APK info ==="
          find . -name "*.apk" -exec ls -lh {} \;
          echo "=== APK contents ==="
          unzip -l app/build/outputs/apk/release/*.apk 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luna-release-apk
          path: app/build/outputs/apk/release/*.apk
