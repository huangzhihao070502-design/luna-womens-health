name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.5' }

      - name: Setup Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk "build-tools;33.0.0" "platforms;android-33"

      - name: Build uni-app H5
        run: |
          npm install
          cp manifest.json src/manifest.json
          cp pages.json src/pages.json
          cat > index.html << 'HTML'
          <!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover"/><title>Luna</title></head><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
          HTML
          npx uni build -p h5
          # Keep absolute paths - WebViewAssetLoader serves via https:// URL

      - name: Generate keystore
        run: |
          $JAVA_HOME/bin/keytool -genkey -v -keystore luna.keystore -alias luna -keyalg RSA -keysize 2048 -validity 36500 -storepass lunapass123 -keypass lunapass123 -dname "CN=Luna,OU=Dev,O=LunaTeam,L=Beijing,ST=Beijing,C=CN"

      - name: Setup Android project
        run: |
          mkdir -p apk/app/src/main/java/com/luna/app
          mkdir -p apk/app/src/main/res/values

          cat > apk/settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS); repositories { google(); mavenCentral() } }
          rootProject.name='Luna'; include ':app'
          EOF

          cat > apk/build.gradle << 'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF

          cat > apk/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.luna.app'; compileSdk 33
              defaultConfig { applicationId "com.luna.app"; minSdk 21; targetSdk 33; versionCode 100; versionName "1.0.0" }
              signingConfigs { release { storeFile rootProject.file("luna.keystore"); storePassword "lunapass123"; keyAlias "luna"; keyPassword "lunapass123" } }
              buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.8.0' }
          EOF

          cat > apk/app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:allowBackup="true" android:label="Luna" android:hardwareAccelerated="true" android:usesCleartextTraffic="true">
                  <activity android:name="com.luna.app.MainActivity" android:configChanges="orientation|keyboardHidden|screenSize" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > apk/app/src/main/java/com/luna/app/MainActivity.java << 'JAVA'
          package com.luna.app;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  WebView wv = new WebView(this);
                  setContentView(wv);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setDatabaseEnabled(true);
                  ws.setUseWideViewPort(true);
                  ws.setLoadWithOverviewMode(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/static/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .addPathHandler("/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  wv.setWebViewClient(new WebViewClient() {
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                  });
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("https://appassets.androidplatform.net/h5/index.html");
              }
          }
          JAVA

          echo '<resources><string name="app_name">Luna</string></resources>' > apk/app/src/main/res/values/strings.xml

          # Copy H5 assets
          mkdir -p apk/app/src/main/assets/h5
          cp -r dist/build/h5/* apk/app/src/main/assets/h5/
          du -sh apk/app/src/main/assets/

          # Copy keystore
          cp luna.keystore apk/
          echo "sdk.dir=/usr/local/lib/android/sdk" > apk/local.properties
          echo "android.useAndroidX=true" > apk/gradle.properties

      - name: Build APK
        run: cd apk && gradle assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: luna-release-apk
          path: apk/app/build/outputs/apk/release/*.apk
